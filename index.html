    <script>
      // Suppress benign Vite HMR WebSocket errors in sandbox iframe environment
      window.addEventListener('unhandledrejection', function(e) {
        if (e.reason && (
          (typeof e.reason.message === 'string' && (e.reason.message.includes('WebSocket') || e.reason.message.includes('vite:ws'))) ||
          (e.reason.stack && e.reason.stack.includes('@vite/client'))
        )) {
          e.preventDefault();
        }
      });
      window.addEventListener('error', function(e) {
        if ((e.message && e.message.includes('WebSocket')) || (e.filename && e.filename.includes('@vite/client'))) {
          e.preventDefault();
        }
      });
    </script>
