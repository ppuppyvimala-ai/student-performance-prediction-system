<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512" width="512" height="512">
  <defs>
    <linearGradient id="bgGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#4f46e5" />
      <stop offset="50%" stop-color="#7c3aed" />
      <stop offset="100%" stop-color="#2563eb" />
    </linearGradient>
    <linearGradient id="accentGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#38bdf8" />
      <stop offset="100%" stop-color="#818cf8" />
    </linearGradient>
    <filter id="shadow" x="-10%" y="-10%" width="130%" height="130%">
      <feDropShadow dx="0" dy="8" stdDeviation="12" flood-color="#000000" flood-opacity="0.3" />
    </filter>
  </defs>

  <!-- Background rounded squircle with safe margin -->
  <rect width="512" height="512" rx="112" fill="url(#bgGrad)" />

  <!-- Subtle grid circuit lines -->
  <path d="M 64 256 H 448 M 256 64 V 448" stroke="rgba(255,255,255,0.08)" stroke-width="2" />
  <circle cx="256" cy="256" r="140" fill="none" stroke="rgba(255,255,255,0.12)" stroke-width="2" stroke-dasharray="6 6" />

  <!-- Graduation Cap & AI Node Motif -->
  <g filter="url(#shadow)" transform="translate(256, 210) scale(1.15)">
    <!-- Mortarboard top -->
    <path d="M 0 -70 L 115 -18 L 0 34 L -115 -18 Z" fill="#ffffff" />
    <path d="M 0 -70 L 115 -18 L 0 -12 L -115 -18 Z" fill="rgba(240, 244, 255, 0.9)" />
    <!-- Cap skull base -->
    <path d="M -65 10 C -65 52 65 52 65 10 L 65 30 C 65 72 -65 72 -65 30 Z" fill="#e0e7ff" />
    <!-- Tassel -->
    <path d="M 115 -18 Q 128 20 120 60" fill="none" stroke="#f59e0b" stroke-width="6" stroke-linecap="round" />
    <circle cx="120" cy="65" r="7" fill="#f59e0b" />
  </g>

  <!-- Prediction Graph Bars / Neural Nodes below -->
  <g transform="translate(136, 320)">
    <!-- Bar 1 -->
    <rect x="0" y="50" width="36" height="50" rx="8" fill="#93c5fd" opacity="0.85" />
    <!-- Bar 2 -->
    <rect x="60" y="25" width="36" height="75" rx="8" fill="#a78bfa" opacity="0.9" />
    <!-- Bar 3 -->
    <rect x="120" y="0" width="36" height="100" rx="8" fill="#38bdf8" />
    <!-- Bar 4 (Peak) -->
    <rect x="180" y="-20" width="36" height="120" rx="8" fill="#ffffff" />
    <!-- Spark line over bars -->
    <path d="M 18 45 L 78 20 L 138 -5 L 198 -25" fill="none" stroke="#fef08a" stroke-width="5" stroke-linecap="round" stroke-linejoin="round" />
    <circle cx="198" cy="-25" r="7" fill="#fef08a" />
  </g>
</svg>
